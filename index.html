<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── PWA Essentials ── -->
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── iOS PWA ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tryonetrade" />
    <link rel="apple-touch-icon" href="/logo/logo.png" />

    <!-- ── Viewport: full screen, no zoom ── -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ── SEO ── -->
    <meta name="description" content="Tryonetrade – Professional trading in Indian Rupees. Crypto, Gold, Stocks." />
    <title>Tryonetrade Trading</title>

    <!-- ── Prevent text selection on mobile (app-like) ── -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body {
        overscroll-behavior: none;
        background-color: #0a0b0f;
        margin: 0;
        padding: 0;
        font-family: 'Space Grotesk', sans-serif;
        /* safe area for notch phones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .font-inter {
        font-family: 'Inter', sans-serif;
      }
      .font-space {
        font-family: 'Space Grotesk', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Service Worker registration ── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
